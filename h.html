<script>

    /* ================= PRODUCT DATA ================= */

    const products = [

        {
            name: "Vitamin C Brightening Face Cream",
            brand: "GlowCart Essentials",
            image: "https://www.gosupps.com/media/catalog/product/6/1/61rZRj5WTtL.jpg",
            price: 499,
            oldPrice: 699,
            offer: "28% OFF",
            rating: "★ 4.5",
            category: "vitamin",
            description:
                "A lightweight Vitamin C face cream designed for daily skincare. It provides hydration and helps give the skin a fresh and radiant appearance."
        },

        {
            name: "Aloe Vera Hydrating Face Cream",
            brand: "GlowCart Essentials",
            image: "https://f.nooncdn.com/p/pzsku/ZF78944DAAB86E95AFDA5Z/45/_/1708106666/f99950ae-7cc5-4a4b-9bf7-feaa9ba9396a.jpg?width=800",
            price: 349,
            oldPrice: 499,
            offer: "30% OFF",
            rating: "★ 4.4",
            category: "cream",
            description:
                "A soothing aloe vera based moisturizing face cream designed to provide comfortable hydration and leave skin feeling soft and refreshed."
        },

        {
            name: "Natural Aloe Vera Moisturizing Cream",
            brand: "GlowCart Naturals",
            image: "https://cdn2.primor.eu/media/catalog/product/cache/f3020b7489dcfc4d1d147cf4dad07b7f/5/9/5907747213821_0a45.webp",
            price: 299,
            oldPrice: 399,
            offer: "25% OFF",
            rating: "★ 4.3",
            category: "natural",
            description:
                "A natural-inspired moisturizing cream with aloe vera designed for a simple daily skincare routine."
        },

        {
            name: "Daily Hydration Face Cream",
            brand: "GlowCart Skin",
            image: "https://images.pexels.com/photos/7941454/pexels-photo-7941454.jpeg",
            price: 449,
            oldPrice: 559,
            offer: "20% OFF",
            rating: "★ 4.6",
            category: "cream",
            description:
                "A daily moisturizer with a lightweight feel. Perfect for adding hydration to your everyday skincare routine."
        },

        {
            name: "Luxury Daily Face Moisturizer",
            brand: "GlowCart Premium",
            image: "https://images.pexels.com/photos/6963149/pexels-photo-6963149.jpeg",
            price: 599,
            oldPrice: 769,
            offer: "22% OFF",
            rating: "★ 4.7",
            category: "cream",
            description:
                "A premium-style daily moisturizer created for a simple and elegant skincare routine."
        }

    ];


    /* ================= VARIABLES ================= */

    let selectedProduct = 0;
    let currentQuantity = 1;

    let cart = JSON.parse(localStorage.getItem("glowcart")) || [];


    /* ================= CART COUNT ================= */

    function updateCartCount() {

        let total = 0;

        cart.forEach(function(item) {
            total += item.quantity;
        });

        document.getElementById("cartCount").innerText = total;
    }


    /* ================= SHOW PRODUCT ================= */

    function showProduct(index) {

        selectedProduct = index;

        const product = products[index];

        document.getElementById("detailImage").src =
            product.image;

        document.getElementById("detailBrand").innerText =
            product.brand;

        document.getElementById("detailName").innerText =
            product.name;

        document.getElementById("detailRating").innerText =
            product.rating;

        document.getElementById("detailPrice").innerText =
            "₹" + product.price;

        document.getElementById("detailOldPrice").innerText =
            "₹" + product.oldPrice;

        document.getElementById("detailOffer").innerText =
            product.offer;

        document.getElementById("detailDescription").innerText =
            product.description;

        currentQuantity = 1;

        document.getElementById("quantity").innerText =
            currentQuantity;

        document.getElementById("productModal").style.display =
            "flex";
    }


    /* ================= CLOSE MODAL ================= */

    function closeModal() {

        document.getElementById("productModal").style.display =
            "none";
    }


    function closeOutside(event) {

        if (
            event.target ===
            document.getElementById("productModal")
        ) {
            closeModal();
        }
    }


    /* ================= QUANTITY ================= */

    function increaseQuantity() {

        currentQuantity++;

        document.getElementById("quantity").innerText =
            currentQuantity;
    }


    function decreaseQuantity() {

        if (currentQuantity > 1) {
            currentQuantity--;
        }

        document.getElementById("quantity").innerText =
            currentQuantity;
    }


    /* ================= ADD TO CART ================= */

    function addToCart() {

        const product = products[selectedProduct];

        const existingProduct = cart.find(function(item) {
            return item.name === product.name;
        });


        if (existingProduct) {

            existingProduct.quantity += currentQuantity;

        } else {

            cart.push({

                name: product.name,
                brand: product.brand,
                image: product.image,
                price: product.price,
                quantity: currentQuantity

            });

        }


        localStorage.setItem(
            "glowcart",
            JSON.stringify(cart)
        );


        updateCartCount();

        closeModal();

        alert(
            product.name +
            " added to cart successfully!"
        );
    }


    /* ================= BUY NOW ================= */

    function buyNow() {

        const product = products[selectedProduct];


        const buyItem = {

            name: product.name,
            brand: product.brand,
            image: product.image,
            price: product.price,
            quantity: currentQuantity

        };


        localStorage.setItem(
            "buyNowProduct",
            JSON.stringify(buyItem)
        );


        window.location.href = "placeorder.html";
    }


    /* ================= OPEN CART ================= */

    function openCart() {

        window.location.href = "cart.html";
    }


    /* ================= SEARCH ================= */

    function searchProducts() {

        const search =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase()
                .trim();


        const cards =
            document.querySelectorAll(".product");


        cards.forEach(function(card) {

            const name =
                card
                    .querySelector(".product-name")
                    .innerText
                    .toLowerCase();


            if (name.includes(search)) {

                card.style.display = "";

            } else {

                card.style.display = "none";

            }

        });

    }


    /* ================= CATEGORY FILTER ================= */

    function filterCategory(category) {

        const cards =
            document.querySelectorAll(".product");


        cards.forEach(function(card) {

            const productCategory =
                card.getAttribute("data-category");


            if (
                category === "cream" ||
                productCategory === category
            ) {

                card.style.display = "";

            } else {

                card.style.display = "none";

            }

        });


        scrollToProducts();
    }


    /* ================= SHOW ALL ================= */

    function showAllProducts() {

        const cards =
            document.querySelectorAll(".product");


        cards.forEach(function(card) {

            card.style.display = "";

        });


        scrollToProducts();
    }


    /* ================= SCROLL ================= */

    function scrollToProducts() {

        document
            .getElementById("productsSection")
            .scrollIntoView({
                behavior: "smooth"
            });

    }


    /* ================= LOGIN ================= */

    function goLogin() {

        window.location.href = "login.html";

    }


    /* ================= ORDERS ================= */

    function openOrders() {

        window.location.href = "orders.html";

    }


    /* ================= START ================= */

    updateCartCount();


    /* ================= CART CLICK ================= */

    document
        .querySelector(".cart")
        .addEventListener("click", openCart);


    /* ================= ORDERS CLICK ================= */

    const orderLinks =
        document.querySelectorAll(".header-link");


    if (orderLinks.length >= 3) {

        orderLinks[2].onclick = openOrders;

    }

</script>
