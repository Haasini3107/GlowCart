<html lang="en">
<head>

```
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffd6e8, #fff7fb);
    }

    .container {
        width: 400px;
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    .logo {
        text-align: center;
        color: #e83e8c;
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #444;
    }

    input {
        width: 100%;
        padding: 13px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 15px;
    }

    input:focus {
        outline: none;
        border-color: #e83e8c;
    }

    button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 25px;
        background: #e83e8c;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #d62978;
    }

    .message {
        text-align: center;
        margin-top: 15px;
        font-weight: bold;
    }

    .register {
        text-align: center;
        margin-top: 20px;
    }

    .register a {
        color: #e83e8c;
        font-weight: bold;
        text-decoration: none;
    }
</style>
```

</head>

<body>

<div class="container">

```
<div class="logo">GlowCart</div>

<h2>Welcome Back</h2>

<form id="loginForm">

    <input
        type="email"
        id="email"
        placeholder="Email Address"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<div class="message" id="message"></div>

<div class="register">
    New to GlowCart?
    <a href="register.html">Create Account</a>
</div>
```

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim().toLowerCase();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    let users =
        JSON.parse(localStorage.getItem("glowcartUsers")) || [];


    const user =
        users.find(
            u =>
                u.email === email &&
                u.password === password
        );


    if (!user) {

        message.style.color = "red";

        message.innerText =
            "Invalid email or password.";

        return;
    }


    localStorage.setItem(
        "glowcartLoggedIn",
        JSON.stringify(user)
    );


    message.style.color = "green";

    message.innerText =
        "Login successful! Welcome to GlowCart, " +
        user.name + "!";


    setTimeout(function() {

        window.location.href = "index.html";

    }, 1800);

});

</script>

</body>
</html>
