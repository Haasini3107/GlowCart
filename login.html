<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
   content="width=device-width, initial-scale=1.0">

<title>GlowCart - Login</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        linear-gradient(
            135deg,
            #ffd6e8,
            #fff7fb
        );
}

.container {

    width: 400px;
    max-width: 92%;

    background: white;

    padding: 35px;

    border-radius: 20px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,0.12);
}

.logo {

    text-align: center;

    color: #e83e8c;

    font-size: 32px;

    font-weight: bold;

    margin-bottom: 8px;
}

h2 {

    text-align: center;

    margin-bottom: 25px;

    color: #444;
}

input {

    width: 100%;

    padding: 13px;

    margin-bottom: 15px;

    border: 1px solid #ddd;

    border-radius: 10px;

    font-size: 15px;
}

input:focus {

    outline: none;

    border-color: #e83e8c;
}

button {

    width: 100%;

    padding: 13px;

    border: none;

    border-radius: 25px;

    background:
        linear-gradient(
            135deg,
            #e91e63,
            #9c27b0
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}

button:hover {

    opacity: 0.9;
}

.message {

    text-align: center;

    margin-top: 15px;

    font-weight: bold;

    line-height: 1.5;
}

.register {

    text-align: center;

    margin-top: 20px;
}

.register a {

    color: #e83e8c;

    font-weight: bold;

    text-decoration: none;
}

.home-link {

    text-align: center;

    margin-top: 15px;
}

.home-link a {

    color: #7b1fa2;

    text-decoration: none;

    font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

```
<div class="logo">
    GlowCart
</div>

<h2>
    Welcome Back
</h2>

<form id="loginForm">

    <input
        type="email"
        id="email"
        placeholder="Email Address"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>

<div
    class="message"
    id="message">
</div>

<div class="register">

    New to GlowCart?

    <a href="register.html">
        Create Account
    </a>

</div>

<div class="home-link">

    <a href="index.html">
        ← Back to GlowCart Home
    </a>

</div>
```

</div>

<script>

document
.getElementById("loginForm")
.addEventListener("submit", function(event) {

    event.preventDefault();

    const email =
        document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password =
        document
        .getElementById("password")
        .value;

    const message =
        document
        .getElementById("message");


    /* GET REGISTERED USERS */

    let users =
        JSON.parse(
            localStorage.getItem("glowcartUsers")
        ) || [];


    /* FIND USER */

    const user =
        users.find(function(u) {

            return (
                u.email.toLowerCase() === email &&
                u.password === password
            );

        });


    /* INVALID LOGIN */

    if (!user) {

        message.style.color = "red";

        message.innerText =
            "Invalid email or password.";

        return;
    }


    /* SAVE LOGIN */

    localStorage.setItem(
        "glowcartLoggedIn",
        JSON.stringify(user)
    );


    /* SUCCESS */

    message.style.color = "green";

    message.innerHTML =
        "Login successful!<br>" +
        "Welcome to GlowCart, " +
        user.name +
        "!";


    /* GO TO MAIN GLOWCART PAGE */

    setTimeout(function() {

        window.location.href =
            "index.html";

    }, 1200);

});

</script>

</body>

</html>
