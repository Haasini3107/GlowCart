<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <style>

        /* =========================
           GLOBAL
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top left,
                    #ffffff 0%,
                    #ffeef2 30%,
                    #ffdce4 65%,
                    #ffcbd6 100%
                );

            color: #3f2930;
        }


        /* =========================
           LOGIN PAGE
        ========================= */

        .login-container {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }


        .login-box {
            width: 400px;

            background: rgba(255, 255, 255, 0.90);

            padding: 40px;

            border-radius: 25px;

            box-shadow:
                0 20px 50px rgba(170, 75, 100, 0.20);

            backdrop-filter: blur(12px);

            border: 1px solid rgba(255,255,255,0.8);

            animation: fadeIn 0.7s ease;
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        .login-icon {
            width: 75px;
            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #ff9fb5,
                #e97895
            );

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 32px;

            box-shadow:
                0 10px 25px rgba(220, 80, 115, 0.30);
        }


        .login-box h1 {
            text-align: center;

            font-size: 28px;

            color: #542d38;

            margin-bottom: 8px;
        }


        .login-subtitle {
            text-align: center;

            color: #97727c;

            margin-bottom: 30px;

            font-size: 14px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-weight: 600;

            color: #603743;
        }


        input,
        textarea {

            width: 100%;

            padding: 14px 16px;

            border: 2px solid #f2d5dc;

            border-radius: 12px;

            outline: none;

            font-size: 15px;

            color: #4a3037;

            background: #fffafa;

            transition: 0.3s;
        }


        input:focus,
        textarea:focus {

            border-color: #e9859e;

            background: white;

            box-shadow:
                0 0 0 4px rgba(233,133,158,0.12);
        }


        textarea {

            min-height: 110px;

            resize: vertical;
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #ed8da5,
                    #d96786
                );

            box-shadow:
                0 8px 20px rgba(217,103,134,0.30);

            transition: 0.3s;
        }


        .login-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(217,103,134,0.40);
        }


        .error {

            text-align: center;

            color: #d52f54;

            margin-top: 15px;

            font-size: 14px;
        }


        /* =========================
           ADMIN PANEL
        ========================= */

        #adminPanel {
            display: none;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {

            height: 75px;

            padding: 0 40px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #d96786,
                    #c44f70
                );

            box-shadow:
                0 5px 25px rgba(180,70,100,0.25);
        }


        .logo {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .logo-icon {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: rgba(255,255,255,0.2);

            font-size: 21px;
        }


        .logo h2 {

            font-size: 21px;
        }


        .logout-btn {

            padding: 10px 18px;

            border: 1px solid rgba(255,255,255,0.5);

            border-radius: 10px;

            background: rgba(255,255,255,0.15);

            color: white;

            cursor: pointer;

            font-weight: 600;

            transition: 0.3s;
        }


        .logout-btn:hover {

            background: white;

            color: #c44f70;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {

            max-width: 1200px;

            margin: auto;

            padding: 35px 20px 50px;
        }


        .welcome {

            margin-bottom: 30px;
        }


        .welcome h1 {

            font-size: 30px;

            color: #542d38;

            margin-bottom: 6px;
        }


        .welcome p {

            color: #8d6872;
        }


        /* =========================
           ADD PRODUCT
        ========================= */

        .add-product {

            background: rgba(255,255,255,0.92);

            padding: 30px;

            border-radius: 20px;

            margin-bottom: 35px;

            box-shadow:
                0 12px 35px rgba(160,70,90,0.12);

            border: 1px solid rgba(255,255,255,0.8);
        }


        .section-title {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 25px;
        }


        .section-icon {

            width: 45px;
            height: 45px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: #ffe1e8;

            color: #d96786;

            font-size: 21px;
        }


        .section-title h2 {

            color: #542d38;

            font-size: 22px;
        }


        .section-title p {

            color: #9b7780;

            font-size: 13px;

            margin-top: 3px;
        }


        .form-grid {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 5px 20px;
        }


        .full-width {

            grid-column: 1 / -1;
        }


        /* =========================
           ADD BUTTON
        ========================= */

        .add-btn {

            margin-top: 10px;

            padding: 14px 25px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #63c48b,
                    #3ba968
                );

            color: white;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 7px 18px rgba(59,169,104,0.25);

            transition: 0.3s;
        }


        .add-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 23px rgba(59,169,104,0.35);
        }


        /* =========================
           PRODUCTS
        ========================= */

        .products-section {

            margin-top: 20px;
        }


        .products-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }


        .products-header h2 {

            color: #542d38;

            font-size: 23px;
        }


        .product-count {

            background: #ffe1e8;

            color: #c44f70;

            padding: 7px 13px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: 700;
        }


        .products {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(250px, 1fr)
                );

            gap: 25px;
        }


        /* =========================
           PRODUCT CARD
        ========================= */

        .product-card {

            background: white;

            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 10px 30px rgba(150,70,90,0.12);

            transition: 0.3s;

            border: 1px solid #f8dce3;
        }


        .product-card:hover {

            transform: translateY(-6px);

            box-shadow:
                0 18px 35px rgba(150,70,90,0.18);
        }


        .product-image {

            position: relative;

            height: 210px;

            overflow: hidden;

            background: #f9e9ed;
        }


        .product-image img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            transition: 0.4s;
        }


        .product-card:hover
        .product-image img {

            transform: scale(1.05);
        }


        .product-info {

            padding: 20px;
        }


        .product-info h3 {

            font-size: 18px;

            color: #542d38;

            margin-bottom: 8px;
        }


        .price {

            color: #d65c7d;

            font-size: 20px;

            font-weight: 800;

            margin-bottom: 10px;
        }


        .description {

            color: #80666d;

            font-size: 14px;

            line-height: 1.6;

            min-height: 45px;

            margin-bottom: 18px;
        }


        /* =========================
           DELETE BUTTON
        ========================= */

        .delete-btn {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 10px;

            background: #fff0f2;

            color: #d94463;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;
        }


        .delete-btn:hover {

            background: #d94463;

            color: white;
        }


        /* =========================
           EMPTY PRODUCTS
        ========================= */

        .no-products {

            grid-column: 1 / -1;

            text-align: center;

            background: white;

            padding: 50px 20px;

            border-radius: 18px;

            color: #97727c;

            box-shadow:
                0 10px 30px rgba(150,70,90,0.08);
        }


        .no-products-icon {

            font-size: 45px;

            margin-bottom: 15px;
        }


        .no-products h3 {

            color: #603743;

            margin-bottom: 7px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            .navbar {

                padding: 0 18px;
            }


            .logo h2 {

                font-size: 17px;
            }


            .container {

                padding: 25px 15px;
            }


            .form-grid {

                grid-template-columns: 1fr;
            }


            .full-width {

                grid-column: auto;
            }


            .add-product {

                padding: 22px;
            }


            .welcome h1 {

                font-size: 25px;
            }


            .products {

                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 450px) {

            .login-box {

                width: 100%;

                padding: 30px 22px;
            }


            .logout-btn {

                padding: 8px 12px;

                font-size: 12px;
            }

        }

    </style>
</head>


<body>


    <!-- =====================================
         LOGIN PAGE
    ====================================== -->

    <div class="login-container" id="loginPage">

        <div class="login-box">

            <div class="login-icon">
                🔐
            </div>

            <h1>Admin Login</h1>

            <p class="login-subtitle">
                Welcome back! Login to manage your products.
            </p>


            <form onsubmit="login(event)">

                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login to Dashboard
                </button>


                <p
                    id="loginError"
                    class="error"
                ></p>

            </form>

        </div>

    </div>



    <!-- =====================================
         ADMIN DASHBOARD
    ====================================== -->

    <div id="adminPanel">


        <!-- NAVBAR -->

        <div class="navbar">

            <div class="logo">

                <div class="logo-icon">
                    🌸
                </div>

                <h2>
                    Admin Dashboard
                </h2>

            </div>


            <button
                class="logout-btn"
                onclick="logout()"
            >
                Logout
            </button>

        </div>



        <div class="container">


            <!-- WELCOME -->

            <div class="welcome">

                <h1>
                    Welcome, Admin 👋
                </h1>

                <p>
                    Manage your products from your dashboard.
                </p>

            </div>



            <!-- ADD PRODUCT -->

            <div class="add-product">

                <div class="section-title">

                    <div class="section-icon">
                        ➕
                    </div>

                    <div>

                        <h2>
                            Add New Product
                        </h2>

                        <p>
                            Enter the details of your new product below.
                        </p>

                    </div>

                </div>



                <form onsubmit="addProduct(event)">

                    <div class="form-grid">


                        <div class="form-group">

                            <label>
                                Product Name
                            </label>

                            <input
                                type="text"
                                id="productName"
                                placeholder="e.g. Pink Dress"
                                required
                            >

                        </div>



                        <div class="form-group">

                            <label>
                                Price (₹)
                            </label>

                            <input
                                type="number"
                                id="productPrice"
                                placeholder="e.g. 999"
                                min="0"
                                step="0.01"
                                required
                            >

                        </div>



                        <div class="form-group full-width">

                            <label>
                                Product Image URL
                            </label>

                            <input
                                type="url"
                                id="productImage"
                                placeholder="https://example.com/product-image.jpg"
                                required
                            >

                        </div>



                        <div class="form-group full-width">

                            <label>
                                Product Description
                            </label>

                            <textarea
                                id="productDescription"
                                placeholder="Write a short description about your product..."
                                required
                            ></textarea>

                        </div>


                    </div>



                    <button
                        type="submit"
                        class="add-btn"
                    >
                        ➕ Add Product
                    </button>

                </form>

            </div>



            <!-- PRODUCTS -->

            <div class="products-section">


                <div class="products-header">

                    <h2>
                        🛍️ Your Products
                    </h2>

                    <span
                        class="product-count"
                        id="productCount"
                    >
                        0 Products
                    </span>

                </div>


                <div
                    id="products"
                    class="products"
                ></div>


            </div>


        </div>

    </div>



    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

    <script>


        /* =========================
           ADMIN LOGIN DETAILS
        ========================= */

        const ADMIN_USERNAME = "admin";

        const ADMIN_PASSWORD = "admin123";



        /* =========================
           LOGIN
        ========================= */

        function login(event) {

            event.preventDefault();


            const username =
                document.getElementById("username").value.trim();


            const password =
                document.getElementById("password").value;


            const error =
                document.getElementById("loginError");



            if (
                username === ADMIN_USERNAME &&
                password === ADMIN_PASSWORD
            ) {

                sessionStorage.setItem(
                    "adminLoggedIn",
                    "true"
                );


                error.textContent = "";


                showAdminPanel();

            }

            else {

                error.textContent =
                    "❌ Incorrect username or password.";

            }

        }



        /* =========================
           SHOW ADMIN PANEL
        ========================= */

        function showAdminPanel() {

            document.getElementById(
                "loginPage"
            ).style.display = "none";


            document.getElementById(
                "adminPanel"
            ).style.display = "block";


            displayProducts();

        }



        /* =========================
           LOGOUT
        ========================= */

        function logout() {

            sessionStorage.removeItem(
                "adminLoggedIn"
            );


            document.getElementById(
                "adminPanel"
            ).style.display = "none";


            document.getElementById(
                "loginPage"
            ).style.display = "flex";


            document.getElementById(
                "username"
            ).value = "";


            document.getElementById(
                "password"
            ).value = "";

        }



        /* =========================
           GET PRODUCTS
        ========================= */

        function getProducts() {

            return JSON.parse(
                localStorage.getItem("products")
            ) || [];

        }



        /* =========================
           SAVE PRODUCTS
        ========================= */

        function saveProducts(products) {

            localStorage.setItem(
                "products",
                JSON.stringify(products)
            );

        }



        /* =========================
           ADD PRODUCT
        ========================= */

        function addProduct(event) {

            event.preventDefault();


            const name =
                document.getElementById(
                    "productName"
                ).value.trim();


            const price =
                document.getElementById(
                    "productPrice"
                ).value;


            const image =
                document.getElementById(
                    "productImage"
                ).value.trim();


            const description =
                document.getElementById(
                    "productDescription"
                ).value.trim();



            const products =
                getProducts();



            const newProduct = {

                id: Date.now(),

                name: name,

                price: price,

                image: image,

                description: description

            };



            products.push(newProduct);


            saveProducts(products);



            /* CLEAR FORM */

            document.getElementById(
                "productName"
            ).value = "";


            document.getElementById(
                "productPrice"
            ).value = "";


            document.getElementById(
                "productImage"
            ).value = "";


            document.getElementById(
                "productDescription"
            ).value = "";



            displayProducts();


            alert(
                "🌸 Product added successfully!"
            );

        }



        /* =========================
           DISPLAY PRODUCTS
        ========================= */

        function displayProducts() {

            const productsContainer =
                document.getElementById(
                    "products"
                );


            const products =
                getProducts();


            productsContainer.innerHTML = "";



            /* PRODUCT COUNT */

            const count =
                document.getElementById(
                    "productCount"
                );


            count.textContent =
                products.length +
                (products.length === 1
                    ? " Product"
                    : " Products");



            /* NO PRODUCTS */

            if (products.length === 0) {

                productsContainer.innerHTML = `

                    <div class="no-products">

                        <div class="no-products-icon">
                            🛍️
                        </div>

                        <h3>
                            No Products Yet
                        </h3>

                        <p>
                            Add your first product using the form above.
                        </p>

                    </div>

                `;

                return;

            }



            /* DISPLAY PRODUCTS */

            products.forEach(function(product) {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "product-card";



                card.innerHTML = `

                    <div class="product-image">

                        <img
                            src="${escapeHTML(product.image)}"
                            alt="${escapeHTML(product.name)}"
                            onerror="
                                this.src =
                                'https://via.placeholder.com/500x350/FFE6EA/9B5B6A?text=No+Image'
                            "
                        >

                    </div>


                    <div class="product-info">

                        <h3>
                            ${escapeHTML(product.name)}
                        </h3>


                        <div class="price">
                            ₹${escapeHTML(product.price)}
                        </div>


                        <p class="description">
                            ${escapeHTML(product.description)}
                        </p>


                        <button
                            class="delete-btn"
                            onclick="deleteProduct(${product.id})"
                        >
                            🗑️ Delete Product
                        </button>

                    </div>

                `;



                productsContainer.appendChild(
                    card
                );

            });

        }



        /* =========================
           DELETE PRODUCT
        ========================= */

        function deleteProduct(id) {

            const confirmation =
                confirm(
                    "Are you sure you want to delete this product?"
                );


            if (!confirmation) {
                return;
            }


            let products =
                getProducts();


            products =
                products.filter(
                    function(product) {

                        return product.id !== id;

                    }
                );


            saveProducts(products);


            displayProducts();


            alert(
                "🗑️ Product deleted successfully!"
            );

        }



        /* =========================
           SECURITY HELPER
        ========================= */

        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }



        /* =========================
           CHECK LOGIN
        ========================= */

        window.onload = function() {

            const loggedIn =
                sessionStorage.getItem(
                    "adminLoggedIn"
                );


            if (loggedIn === "true") {

                showAdminPanel();

            }

        };

    </script>

</body>
</html>
