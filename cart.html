```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GlowCart - Shopping Cart</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background:
        radial-gradient(circle at 10% 20%, #ffe4ef, transparent 25%),
        radial-gradient(circle at 90% 10%, #eadcff, transparent 25%),
        #faf8fc;
    color: #333;
}

/* HEADER */
.header {
    min-height: 75px;
    background: rgba(255,255,255,0.97);
    display: flex;
    align-items: center;
    padding: 15px 7%;
    gap: 25px;
    box-shadow: 0 3px 20px rgba(0,0,0,0.08);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    text-decoration: none;
    font-size: 30px;
    font-weight: bold;
    color: #e91e63;
    margin-right: auto;
}

.logo span {
    color: #7b1fa2;
}

.search {
    display: flex;
    width: 380px;
    height: 42px;
    border: 1px solid #ddd;
    border-radius: 25px;
    overflow: hidden;
    background: white;
}

.search input {
    flex: 1;
    border: none;
    outline: none;
    padding: 0 18px;
    font-size: 14px;
}

.search button {
    width: 55px;
    border: none;
    background: linear-gradient(135deg,#e91e63,#9c27b0);
    color: white;
    cursor: pointer;
    font-size: 18px;
}

.nav-link {
    text-decoration: none;
    color: #444;
    font-weight: bold;
}

.nav-link:hover {
    color: #e91e63;
}

/* NAVIGATION */
.nav-bar {
    background: white;
    padding: 14px 7%;
    border-bottom: 1px solid #eee;
}

.nav-bar a {
    text-decoration: none;
    color: #666;
    font-weight: 600;
    margin-right: 25px;
}

.nav-bar a:hover {
    color: #e91e63;
}

/* MAIN */
.cart-container {
    max-width: 1200px;
    margin: 50px auto;
    padding: 0 25px;
}

.page-title {
    text-align: center;
    margin-bottom: 40px;
}

.page-title h1 {
    font-size: 38px;
    color: #6a1b9a;
    margin-bottom: 10px;
}

.page-title p {
    color: #777;
}

/* CART LAYOUT */
.cart-layout {
    display: grid;
    grid-template-columns: 1fr 360px;
    gap: 30px;
    align-items: start;
}

.cart-products {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

/* CART ITEM */
.cart-item {
    background: white;
    border-radius: 20px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 22px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.07);
    border: 1px solid #f1e8f0;
}

.cart-image {
    width: 135px;
    height: 135px;
    border-radius: 18px;
    background: linear-gradient(135deg,#fff0f6,#f3e8ff);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
}

.cart-image img {
    width: 115px;
    height: 115px;
    object-fit: contain;
}

.product-details {
    flex: 1;
}

.product-details h3 {
    font-size: 20px;
    color: #6a1b9a;
    margin-bottom: 8px;
}

.product-details .price {
    color: #e91e63;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

.item-total {
    margin-bottom: 12px;
}

/* QUANTITY */
.quantity-box {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}

.quantity-box button {
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 50%;
    background: #fce4ec;
    color: #c2185b;
    font-size: 18px;
    cursor: pointer;
    font-weight: bold;
}

.quantity-box button:hover {
    background: #f8bbd0;
}

.quantity-box span {
    font-weight: bold;
    min-width: 20px;
    text-align: center;
}

.remove-button {
    border: none;
    background: transparent;
    color: #e91e63;
    cursor: pointer;
    font-weight: bold;
}

.remove-button:hover {
    text-decoration: underline;
}

/* SUMMARY */
.cart-summary {
    background: white;
    padding: 30px;
    border-radius: 22px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.09);
    position: sticky;
    top: 110px;
}

.cart-summary h2 {
    color: #6a1b9a;
    margin-bottom: 25px;
}

.summary-row {
    display: flex;
    justify-content: space-between;
    margin: 18px 0;
    color: #555;
}

.summary-row.total {
    color: #6a1b9a;
    font-size: 22px;
    font-weight: bold;
}

.green {
    color: #2e7d32;
    font-weight: bold;
}

.summary-line {
    border: none;
    border-top: 1px solid #eee;
    margin: 20px 0;
}

.checkout-button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 30px;
    background: linear-gradient(135deg,#e91e63,#9c27b0);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.checkout-button:hover {
    transform: translateY(-2px);
}

.secure-box {
    text-align: center;
    margin-top: 20px;
    padding: 12px;
    border-radius: 12px;
    background: #fff5f9;
    color: #777;
    font-size: 13px;
}

/* EMPTY CART */
.empty-cart {
    background: white;
    padding: 70px 30px;
    text-align: center;
    border-radius: 25px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

.empty-icon {
    font-size: 65px;
    margin-bottom: 20px;
}

.empty-cart h2 {
    color: #6a1b9a;
    margin-bottom: 10px;
}

.empty-cart p {
    color: #777;
    margin-bottom: 25px;
}

.shop-now {
    display: inline-block;
    padding: 13px 28px;
    background: linear-gradient(135deg,#e91e63,#9c27b0);
    color: white;
    text-decoration: none;
    border-radius: 25px;
    font-weight: bold;
}

/* FOOTER */
footer {
    margin-top: 80px;
    background: #211d24;
    color: white;
    text-align: center;
    padding: 30px;
}

footer span {
    color: #f06292;
}

/* MOBILE */
@media(max-width:850px) {

    .header {
        flex-wrap: wrap;
        padding: 15px 20px;
    }

    .logo {
        margin-right: 0;
    }

    .search {
        order: 3;
        width: 100%;
    }

    .cart-layout {
        grid-template-columns: 1fr;
    }

    .cart-summary {
        position: static;
    }
}

@media(max-width:550px) {

    .cart-item {
        flex-direction: column;
        text-align: center;
    }

    .quantity-box {
        justify-content: center;
    }

    .product-details {
        width: 100%;
    }

    .page-title h1 {
        font-size: 30px;
    }
}
</style>
</head>

<body>

<!-- HEADER -->
<header class="header">

    <a href="h.html" class="logo">
        Glow<span>Cart</span>
    </a>

    <div class="search">
        <input
            type="text"
            id="searchInput"
            placeholder="Search skincare products..."
            onkeydown="searchProducts(event)"
        >

        <button onclick="searchProducts()">
            🔍
        </button>
    </div>

    <a href="index.html" class="nav-link">
        Login
    </a>

    <a href="orders.html" class="nav-link">
        Orders
    </a>

</header>

<!-- NAVIGATION -->
<nav class="nav-bar">

    <a href="h.html">
        Home
    </a>

    <a href="h.html#productsSection">
        Continue Shopping
    </a>

</nav>

<!-- CART -->
<div class="cart-container">

    <div class="page-title">

        <h1>
            Your Shopping Cart 🛍️
        </h1>

        <p>
            Review your skincare favourites before checkout
        </p>

    </div>

    <div class="cart-layout">

        <!-- PRODUCTS -->
        <div
            class="cart-products"
            id="cartItems">
        </div>

        <!-- SUMMARY -->
        <div class="cart-summary">

            <h2>
                Order Summary
            </h2>

            <div class="summary-row">
                <span>Subtotal</span>

                <span>
                    ₹<span id="subtotal">0</span>
                </span>
            </div>

            <div class="summary-row">
                <span>Delivery</span>

                <span class="green">
                    FREE
                </span>
            </div>

            <hr class="summary-line">

            <div class="summary-row total">
                <span>Total</span>

                <span>
                    ₹<span id="total">0</span>
                </span>
            </div>

            <button
                class="checkout-button"
                onclick="checkout()">

                Proceed to Checkout →

            </button>

            <div class="secure-box">
                🔒 Secure & Safe Checkout
            </div>

        </div>

    </div>

</div>

<footer>

    <p>
        © 2026 <span>GlowCart</span>
        · Premium Skincare Shopping
    </p>

</footer>


<script>

/* =========================================
   GET CART
========================================= */

let cart = [];

try {

    cart = JSON.parse(
        localStorage.getItem("cart")
    ) || [];

} catch(error) {

    cart = [];

}


/* =========================================
   PRICE CONVERTER
========================================= */

function getPrice(value) {

    if (typeof value === "number") {
        return value;
    }

    if (typeof value === "string") {

        let number = value
            .replace(/₹/g, "")
            .replace(/,/g, "")
            .replace(/[^\d.]/g, "");

        return Number(number) || 0;
    }

    return 0;
}


/* =========================================
   DISPLAY CART
========================================= */

function displayCart() {

    const container =
        document.getElementById("cartItems");

    container.innerHTML = "";

    let total = 0;


    /* EMPTY CART */

    if (!Array.isArray(cart) || cart.length === 0) {

        container.innerHTML = `

            <div class="empty-cart">

                <div class="empty-icon">
                    🛍️
                </div>

                <h2>
                    Your GlowCart is Empty
                </h2>

                <p>
                    Your favourite skincare products
                    are waiting for you.
                </p>

                <a
                    href="h.html#productsSection"
                    class="shop-now">

                    Explore Products →

                </a>

            </div>

        `;

        updateTotals(0);

        return;
    }


    /* DISPLAY ITEMS */

    cart.forEach(function(item, index) {

        if (!item) return;


        const price =
            getPrice(item.price);


        let quantity =
            parseInt(item.quantity);


        if (!quantity || quantity < 1) {
            quantity = 1;
            item.quantity = 1;
        }


        const itemTotal =
            price * quantity;


        total += itemTotal;


        const image =
            item.image ||
            "https://via.placeholder.com/150?text=GlowCart";


        const name =
            item.name ||
            "GlowCart Product";


        container.innerHTML += `

            <div class="cart-item">

                <div class="cart-image">

                    <img
                        src="${image}"
                        alt="${name}"
                        onerror="this.src='https://via.placeholder.com/150?text=GlowCart'"
                    >

                </div>


                <div class="product-details">

                    <h3>
                        ${name}
                    </h3>


                    <p class="price">
                        ₹${price.toLocaleString("en-IN")}
                    </p>


                    <div class="quantity-box">

                        <button
                            onclick="decreaseQuantity(${index})">
                            −
                        </button>

                        <span>
                            ${quantity}
                        </span>

                        <button
                            onclick="increaseQuantity(${index})">
                            +
                        </button>

                    </div>


                    <p class="item-total">

                        Item Total:

                        <strong>
                            ₹${itemTotal.toLocaleString("en-IN")}
                        </strong>

                    </p>


                    <button
                        class="remove-button"
                        onclick="removeItem(${index})">

                        🗑 Remove from Cart

                    </button>

                </div>

            </div>

        `;

    });


    updateTotals(total);

}


/* =========================================
   UPDATE TOTALS
========================================= */

function updateTotals(total) {

    document.getElementById("subtotal")
        .innerText =
        Number(total).toLocaleString("en-IN");


    document.getElementById("total")
        .innerText =
        Number(total).toLocaleString("en-IN");

}


/* =========================================
   INCREASE
========================================= */

function increaseQuantity(index) {

    if (!cart[index]) return;

    let quantity =
        parseInt(cart[index].quantity) || 1;

    cart[index].quantity =
        quantity + 1;

    saveCart();

}


/* =========================================
   DECREASE
========================================= */

function decreaseQuantity(index) {

    if (!cart[index]) return;

    let quantity =
        parseInt(cart[index].quantity) || 1;


    if (quantity > 1) {

        cart[index].quantity =
            quantity - 1;

    } else {

        cart.splice(index, 1);

    }


    saveCart();

}


/* =========================================
   REMOVE
========================================= */

function removeItem(index) {

    if (!cart[index]) return;


    cart.splice(index, 1);

    saveCart();

}


/* =========================================
   SAVE CART
========================================= */

function saveCart() {

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    displayCart();

}


/* =========================================
   CHECKOUT
========================================= */

function checkout() {

    if (!cart || cart.length === 0) {

        alert(
            "Your GlowCart is empty. Please add a product first."
        );

        return;
    }


    /*
       Your repository has place.html,
       so checkout must go there.
    */

    window.location.href =
        "place.html";

}


/* =========================================
   SEARCH
========================================= */

function searchProducts(event) {

    if (event && event.key !== "Enter") {
        return;
    }


    const input =
        document.getElementById("searchInput");


    const search =
        input.value.trim();


    if (search.length === 0) {
        window.location.href = "h.html#productsSection";
        return;
    }


    window.location.href =
        "h.html#productsSection?search=" +
        encodeURIComponent(search);

}


/* =========================================
   LOAD
========================================= */

displayCart();

</script>

</body>
</html>
