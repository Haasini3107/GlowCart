<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>GlowCart - Checkout</title>

<style>

/* ================= GLOBAL ================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 10% 20%,
            #ffddea,
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 10%,
            #eadbff,
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #fff7fa,
            #f8f2ff
        );

    color: #333;
}


/* ================= HEADER ================= */

.header {

    height: 75px;

    background: rgba(255,255,255,0.96);

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 0 7%;

    box-shadow:
        0 3px 20px rgba(0,0,0,0.08);

    position: sticky;

    top: 0;

    z-index: 1000;
}


.logo {

    text-decoration: none;

    font-size: 30px;

    font-weight: bold;

    letter-spacing: -1px;

    color: #e91e63;
}


.logo span {

    color: #7b1fa2;

}


.nav-link {

    text-decoration: none;

    color: #6a1b9a;

    font-weight: bold;

    padding: 11px 20px;

    border-radius: 25px;

    transition: 0.3s;
}


.nav-link:hover {

    background: #fff0f6;

    color: #e91e63;

}


/* ================= CHECKOUT AREA ================= */

.checkout-container {

    max-width: 1150px;

    margin: 55px auto;

    padding: 0 25px;

}


.checkout-title {

    text-align: center;

    margin-bottom: 40px;
}


.checkout-title h1 {

    font-size: 40px;

    color: #6a1b9a;

    margin-bottom: 10px;

}


.checkout-title p {

    color: #777;

    font-size: 16px;

}


/* ================= LAYOUT ================= */

.checkout-layout {

    display: grid;

    grid-template-columns: 1fr 360px;

    gap: 30px;

    align-items: start;

}


/* ================= FORM CARD ================= */

.checkout-form {

    background: white;

    padding: 38px;

    border-radius: 24px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.08);

    border: 1px solid #f1e5ef;
}


.section-heading {

    display: flex;

    align-items: center;

    gap: 12px;

    margin-bottom: 25px;
}


.section-icon {

    width: 45px;

    height: 45px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #fff0f6;

    font-size: 21px;

}


.section-heading h2 {

    color: #6a1b9a;

    font-size: 24px;

}


/* ================= INPUTS ================= */

.form-group {

    margin-bottom: 20px;

}


.form-group label {

    display: block;

    margin-bottom: 8px;

    font-size: 14px;

    font-weight: bold;

    color: #444;

}


.form-group input,
.form-group textarea {

    width: 100%;

    border: 1px solid #ddd;

    border-radius: 12px;

    padding: 14px 16px;

    font-size: 15px;

    outline: none;

    transition: 0.3s;

    background: #fff;

}


.form-group textarea {

    height: 110px;

    resize: vertical;

}


.form-group input:focus,
.form-group textarea:focus {

    border-color: #e91e63;

    box-shadow:
        0 0 0 4px rgba(233,30,99,0.08);

}


/* ================= TWO COLUMNS ================= */

.input-row {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 18px;

}


/* ================= PAYMENT ================= */

.payment-section {

    margin-top: 30px;

    padding-top: 25px;

    border-top: 1px solid #eee;

}


.payment-option {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 15px 17px;

    margin-bottom: 12px;

    border: 1px solid #eee;

    border-radius: 13px;

    cursor: pointer;

    transition: 0.3s;

}


.payment-option:hover {

    border-color: #e91e63;

    background: #fff8fb;

}


.payment-option input {

    accent-color: #e91e63;

    width: 18px;

    height: 18px;

}


.payment-content {

    display: flex;

    flex-direction: column;

    gap: 4px;

}


.payment-title {

    font-weight: bold;

    color: #444;

}


.payment-description {

    color: #888;

    font-size: 13px;

}


/* ================= PLACE ORDER ================= */

.place-order {

    width: 100%;

    border: none;

    margin-top: 25px;

    padding: 16px;

    border-radius: 30px;

    background:
        linear-gradient(
            135deg,
            #e91e63,
            #9c27b0
        );

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 10px 25px rgba(156,39,176,0.25);

    transition: 0.3s;

}


.place-order:hover {

    transform: translateY(-3px);

    box-shadow:
        0 15px 30px rgba(156,39,176,0.35);

}


/* ================= ORDER SUMMARY ================= */

.order-summary {

    background: white;

    padding: 30px;

    border-radius: 24px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.08);

    border: 1px solid #f1e5ef;

    position: sticky;

    top: 105px;
}


.order-summary h2 {

    color: #6a1b9a;

    font-size: 23px;

    margin-bottom: 22px;

}


.summary-items {

    max-height: 300px;

    overflow-y: auto;

}


.summary-item {

    display: flex;

    align-items: center;

    gap: 12px;

    padding: 12px 0;

    border-bottom: 1px solid #f2f2f2;

}


.summary-item img {

    width: 60px;

    height: 60px;

    object-fit: contain;

    border-radius: 12px;

    background: #fff0f6;

}


.summary-item-info {

    flex: 1;

}


.summary-item-info h4 {

    color: #555;

    font-size: 14px;

    margin-bottom: 5px;

}


.summary-item-info p {

    color: #999;

    font-size: 13px;

}


.summary-price {

    font-weight: bold;

    color: #e91e63;

}


/* ================= TOTAL ================= */

.price-row {

    display: flex;

    justify-content: space-between;

    margin: 16px 0;

    color: #555;

}


.free {

    color: #2e7d32;

    font-weight: bold;

}


.summary-line {

    border: none;

    border-top: 1px solid #eee;

    margin: 20px 0;

}


.total-row {

    display: flex;

    justify-content: space-between;

    color: #6a1b9a;

    font-size: 21px;

    font-weight: bold;

}


/* ================= SECURITY ================= */

.security {

    margin-top: 22px;

    padding: 14px;

    background: #fff5f9;

    border-radius: 12px;

    text-align: center;

    color: #777;

    font-size: 13px;

}


/* ================= FOOTER ================= */

footer {

    margin-top: 80px;

    background: #211d24;

    color: white;

    text-align: center;

    padding: 28px;

}


footer span {

    color: #f06292;

}


/* ================= MOBILE ================= */

@media(max-width: 850px) {

    .checkout-layout {

        grid-template-columns: 1fr;

    }


    .order-summary {

        position: static;

    }

}


@media(max-width: 600px) {

    .header {

        padding: 15px 20px;

        height: auto;

    }


    .logo {

        font-size: 25px;

    }


    .checkout-container {

        margin: 30px auto;

    }


    .checkout-title h1 {

        font-size: 31px;

    }


    .checkout-form {

        padding: 25px 20px;

    }


    .input-row {

        grid-template-columns: 1fr;

        gap: 0;

    }

}

</style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="header">

<a href="home.html"
class="logo">

Glow<span>Cart</span>

</a>


<a href="cart.html"
class="nav-link">

← Back to Cart

</a>

</header>



<!-- ================= CHECKOUT ================= -->

<div class="checkout-container">


<div class="checkout-title">

<h1>
Complete Your Order ✨
</h1>

<p>
Just a few details and your skincare favourites will be on their way.
</p>

</div>



<div class="checkout-layout">


<!-- ================= DELIVERY FORM ================= -->

<div class="checkout-form">


<div class="section-heading">

<div class="section-icon">
📍
</div>

<h2>
Delivery Details
</h2>

</div>


<div class="form-group">

<label>
Full Name
</label>

<input
type="text"
id="name"
placeholder="Enter your full name">

</div>



<div class="form-group">

<label>
Mobile Number
</label>

<input
type="tel"
id="phone"
placeholder="Enter your 10-digit mobile number">

</div>



<div class="form-group">

<label>
Complete Address
</label>

<textarea
id="address"
placeholder="House / Flat No., Street, Area"></textarea>

</div>



<div class="input-row">


<div class="form-group">

<label>
City
</label>

<input
type="text"
id="city"
placeholder="Enter city">

</div>


<div class="form-group">

<label>
Pincode
</label>

<input
type="text"
id="pincode"
placeholder="Enter pincode">

</div>


</div>



<!-- ================= PAYMENT ================= -->

<div class="payment-section">


<div class="section-heading">

<div class="section-icon">
💳
</div>

<h2>
Payment Method
</h2>

</div>



<label class="payment-option">

<input
type="radio"
name="payment"
value="COD"
checked>

<div class="payment-content">

<span class="payment-title">
Cash on Delivery
</span>

<span class="payment-description">
Pay when your order arrives
</span>

</div>

</label>



<label class="payment-option">

<input
type="radio"
name="payment"
value="Online Payment">

<div class="payment-content">

<span class="payment-title">
Online Payment
</span>

<span class="payment-description">
Demo payment option for project
</span>

</div>

</label>


</div>



<button
class="place-order"
onclick="placeOrder()">

Place Order → 

</button>


</div>



<!-- ================= ORDER SUMMARY ================= -->

<div class="order-summary">


<h2>
Your Order 🛍️
</h2>


<div
class="summary-items"
id="summaryItems">

</div>


<hr class="summary-line">


<div class="price-row">

<span>
Subtotal
</span>

<span>
₹<span id="subtotal">0</span>
</span>

</div>


<div class="price-row">

<span>
Delivery
</span>

<span class="free">
FREE
</span>

</div>


<hr class="summary-line">


<div class="total-row">

<span>
Total
</span>

<span>
₹<span id="total">0</span>
</span>

</div>


<div class="security">

🔒 Your order information is secure

</div>


</div>

</div>

</div>



<!-- ================= FOOTER ================= -->

<footer>

<p>

© 2026
<span>GlowCart</span>
· Premium Skincare Shopping

</p>

</footer>



<script>


/* ================= LOAD CART ================= */

let cart =
JSON.parse(localStorage.getItem("cart")) || [];



/* ================= DISPLAY ORDER ================= */

function displayOrder() {


let container =
document.getElementById("summaryItems");


let total = 0;


container.innerHTML = "";



if(cart.length === 0) {

container.innerHTML = `

<p style="
text-align:center;
color:#777;
padding:20px 0;
">

Your cart is empty.

</p>

`;

return;

}



cart.forEach(function(item) {


let price =
parseInt(
item.price
.replace("₹","")
.replace(",","")
);


let itemTotal =
price * item.quantity;


total += itemTotal;



container.innerHTML += `

<div class="summary-item">

<img
src="${item.image}"
alt="${item.name}">


<div class="summary-item-info">

<h4>
${item.name}
</h4>

<p>
Quantity: ${item.quantity}
</p>

</div>


<div class="summary-price">

₹${itemTotal}

</div>

</div>

`;

});



document.getElementById("subtotal")
.innerText = total;


document.getElementById("total")
.innerText = total;

}



/* ================= PLACE ORDER ================= */

function placeOrder() {


let name =
document.getElementById("name").value.trim();


let phone =
document.getElementById("phone").value.trim();


let address =
document.getElementById("address").value.trim();


let city =
document.getElementById("city").value.trim();


let pincode =
document.getElementById("pincode").value.trim();



/* VALIDATION */

if(
name === "" ||
phone === "" ||
address === "" ||
city === "" ||
pincode === ""
) {

alert(
"Please fill all delivery details."
);

return;

}



if(!/^[0-9]{10}$/.test(phone)) {

alert(
"Please enter a valid 10-digit mobile number."
);

return;

}



if(!/^[0-9]{6}$/.test(pincode)) {

alert(
"Please enter a valid 6-digit pincode."
);

return;

}



/* CHECK CART */

if(cart.length === 0) {

alert(
"Your GlowCart is empty."
);

window.location.href =
"products.html";

return;

}



/* GET ORDERS */

let orders =
JSON.parse(
localStorage.getItem("orders")
) || [];



/* PAYMENT */

let payment =
document.querySelector(
'input[name="payment"]:checked'
).value;



/* CREATE ORDER */

let order = {

id:
"GC" + Date.now(),

name: name,

phone: phone,

address: address,

city: city,

pincode: pincode,

payment: payment,

items: cart,

date:
new Date().toLocaleDateString(),

status:
"Order Placed"

};



/* SAVE ORDER */

orders.push(order);


localStorage.setItem(
"orders",
JSON.stringify(orders)
);



/* CLEAR CART */

localStorage.removeItem("cart");



/* SUCCESS */

alert(
"🎉 Order placed successfully! Welcome to GlowCart."
);



/* GO TO ORDERS */

window.location.href =
"orders.html";

}



/* ================= LOAD ================= */

displayOrder();

</script>


</body>

</html>
