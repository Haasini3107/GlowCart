<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GlowCart - Products</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff7fb;
            color: #333;
        }

        header {
            background: linear-gradient(135deg, #ff69a6, #ff8fc4);
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .hero {
            text-align: center;
            padding: 45px 20px 30px;
        }

        .hero h1 {
            color: #e83e8c;
            font-size: 38px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #777;
            font-size: 17px;
        }

        .status {
            text-align: center;
            margin: 15px auto;
            font-weight: bold;
            color: #e83e8c;
        }

        .product-grid {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto 60px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 15px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-7px);
        }

        .product-card img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .product-card h3 {
            color: #444;
            margin-bottom: 10px;
            font-size: 19px;
        }

        .price {
            color: #e83e8c;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .product-card button {
            width: 100%;
            border: none;
            background: #e83e8c;
            color: white;
            padding: 12px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .product-card button:hover {
            background: #d62978;
        }

        .error {
            text-align: center;
            color: red;
            font-weight: bold;
            padding: 30px;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {

            header {
                flex-direction: column;
                gap: 10px;
            }

            nav a {
                margin: 0 7px;
            }

            .hero h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <header>

        <div class="logo">
            GlowCart
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="product.html">Products</a>
            <a href="cart.html">Cart</a>
            <a href="orders.html">Orders</a>
        </nav>

    </header>


    <section class="hero">

        <h1>Our Premium Products</h1>

        <p>
            Discover skincare products for healthy and glowing skin.
        </p>

    </section>


    <div class="status" id="status">
        Loading products...
    </div>


    <div class="product-grid" id="productGrid">
    </div>


    <footer>

        <p>© 2026 GlowCart. All Rights Reserved.</p>

    </footer>


    <script>

        const API_URL =
            "https://glowcart-backend-nrye.onrender.com";


        async function loadProducts() {

            const productGrid =
                document.getElementById("productGrid");

            const status =
                document.getElementById("status");

            try {

                const response =
                    await fetch(API_URL + "/api/products");

                if (!response.ok) {

                    throw new Error(
                        "Server returned an error"
                    );

                }

                const products =
                    await response.json();


                productGrid.innerHTML = "";

                status.innerText =
                    products.length + " products available";


                products.forEach(product => {

                    const card =
                        document.createElement("div");

                    card.className =
                        "product-card";


                    card.innerHTML = `

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                        >

                        <h3>
                            ${product.name}
                        </h3>

                        <div class="price">
                            ₹${product.price}
                        </div>

                        <button
                            onclick="addToCart(
                                ${product.id},
                                '${product.name.replace(/'/g, "\\'")}',
                                ${product.price},
                                '${product.image}'
                            )"
                        >
                            Add to Cart
                        </button>

                    `;


                    productGrid.appendChild(card);

                });


            } catch (error) {

                console.error(error);

                status.innerText = "";

                productGrid.innerHTML = `

                    <div class="error">

                        Unable to load products.

                        <br><br>

                        Please try again.

                    </div>

                `;

            }

        }


        function addToCart(
            id,
            name,
            price,
            image
        ) {

            let cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            const existingProduct =
                cart.find(
                    item => item.id === id
                );


            if (existingProduct) {

                existingProduct.quantity++;

            } else {

                cart.push({

                    id: id,

                    name: name,

                    price: price,

                    image: image,

                    quantity: 1

                });

            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            alert(
                name + " added to cart!"
            );

        }


        loadProducts();

    </script>

</body>

</html>
