<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ffd6e8, #fff7fb);
    }

    .container {
        width: 400px;
        background: white;
        padding: 35px;
        border-radius: 20px;
        box-shadow: 0 10px 35px rgba(0,0,0,0.12);
    }

    .logo {
        text-align: center;
        color: #e83e8c;
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #444;

    input {
        width: 100%;
        padding: 13px;
        margin-bottom: 15px;
        border: 1px solid #ddd;

    }

    input:focus {
        outline: none;

        font-weight: bold;

</style>
```

</head>

<body>

<div class="container">

```
<div class="logo">GlowCart</div>

<h2>Create Account</h2>

<form id="registerForm">

    <input
        type="text"
        id="name"
        placeholder="Full Name"
        required
    >

    <input
        type="email"
        id="email"
        placeholder="Email Address"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Register
    </button>

</form>

<div class="message" id="message"></div>

<div class="login">
    Already registered?
    <a href="login.html">Login</a>
</div>
```

</div>

<script>

document.getElementById("registerForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim().toLowerCase();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("message");


    let users =
        JSON.parse(localStorage.getItem("glowcartUsers")) || [];


    const existingUser =
        users.find(user => user.email === email);


    if (existingUser) {

        message.style.color = "red";

        message.innerText =
            "You are already registered. Please login.";

        setTimeout(function() {
            window.location.href = "login.html";
        }, 1500);

        return;
    }


    users.push({
        name: name,
        email: email,
        password: password
    });


    localStorage.setItem(
        "glowcartUsers",
        JSON.stringify(users)
    );


    message.style.color = "green";

    message.innerText =
        "Registration successful! Redirecting to login...";


    setTimeout(function() {
        window.location.href = "login.html";
    }, 1500);

});

</script>

</body>
</html>
