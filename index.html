```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlowCart - Premium Face Creams</title>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#fff5fb;
    color:#333;
}

header{
    background:linear-gradient(135deg,#ff4f9a,#8e44ad);
    color:white;
    padding:18px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

nav button{
    background:none;
    border:none;
    color:white;
    margin-left:15px;
    font-size:15px;
    cursor:pointer;
}

.hero{
    min-height:88vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px 20px;
    background:linear-gradient(135deg,#ffe0ef,#ead5ff);
}

.hero-content h1{
    font-size:55px;
    color:#8e44ad;
    margin-bottom:15px;
}

.hero-content h2{
    font-size:28px;
    color:#ff4081;
    margin-bottom:15px;
}

.hero-content p{
    font-size:18px;
    margin-bottom:30px;
}

.btn{
    border:none;
    padding:13px 28px;
    border-radius:25px;
    background:linear-gradient(135deg,#ff4081,#8e44ad);
    color:white;
    font-size:16px;
    cursor:pointer;
    margin:5px;
}

.btn:hover{
    opacity:.9;
    transform:scale(1.02);
}

.page{
    display:none;
    min-height:85vh;
    padding:45px 6%;
}

.active{
    display:block;
}

.form-box{
    max-width:500px;
    margin:20px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.form-box h2{
    text-align:center;
    color:#8e44ad;
    margin-bottom:25px;
}

input,select{
    width:100%;
    padding:13px;
    margin:8px 0 15px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
}

input:focus,select:focus{
    border-color:#b84dce;
}

.section-title{
    text-align:center;
    color:#8e44ad;
    font-size:32px;
    margin-bottom:30px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
}

.product{
    background:white;
    padding:18px;
    border-radius:18px;
    box-shadow:0 6px 20px rgba(0,0,0,.1);
    text-align:center;
}

.product img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:14px;
}

.product h3{
    margin:12px 0 8px;
    color:#7d3c98;
}

.price{
    color:#ff4081;
    font-size:20px;
    font-weight:bold;
    margin:10px;
}

.cart-item{
    background:white;
    margin:12px auto;
    padding:18px;
    max-width:800px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.total-box{
    max-width:500px;
    margin:25px auto;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 5px 18px rgba(0,0,0,.1);
}

.total-box p{
    display:flex;
    justify-content:space-between;
    margin:10px 0;
}

.grand-total{
    font-size:23px;
    color:#8e44ad;
    font-weight:bold;
}

.success{
    text-align:center;
    max-width:600px;
    margin:80px auto;
    background:white;
    padding:45px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.success h2{
    color:#8e44ad;
    margin-bottom:15px;
}

.payment{
    background:#fff5fb;
    padding:15px;
    border-radius:12px;
    margin:15px 0;
}

.payment label{
    display:block;
    margin:12px 0;
}

footer{
    background:linear-gradient(135deg,#8e44ad,#ff4081);
    color:white;
    text-align:center;
    padding:20px;
}

.hidden{
    display:none;
}

@media(max-width:700px){
    .hero-content h1{
        font-size:40px;
    }

    header{
        flex-direction:column;
        gap:10px;
    }

    nav button{
        margin:4px;
    }

    .cart-item{
        flex-direction:column;
        gap:10px;
