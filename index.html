/* =====================================================
   LOAD EMAILJS CONFIG FROM RENDER
===================================================== */

async function loadEmailJSConfig(){

    try{

        const response =
            await fetch(
                API_BASE + "/api/emailjs-config"
            );

        const data =
            await response.json();

        if(
            !response.ok ||
            !data.success
        ){

            console.error(
                "EmailJS config error:",
                data.message
            );

            return false;

        }

        EMAILJS_CONFIG = data;

        emailjs.init({
            publicKey:
                EMAILJS_CONFIG.publicKey
        });

        console.log(
            "EmailJS initialized successfully."
        );

        return true;

    }catch(error){

        console.error(
            "Unable to load EmailJS configuration:",
            error
        );

        return false;

    }

}


/* =====================================================
   SEND EMAILJS EMAIL
===================================================== */

async function sendEmailJS(
    templateId,
    templateParams
){

    try{

        if(!EMAILJS_CONFIG){

            const loaded =
                await loadEmailJSConfig();

            if(!loaded){

                return {
                    success:false,
                    message:
                        "EmailJS configuration could not be loaded."
                };

            }

        }

        const result =
            await emailjs.send(

                EMAILJS_CONFIG.serviceId,

                templateId,

                templateParams

            );

        console.log(
            "EmailJS success:",
            result
        );

        return {
            success:true
        };

    }catch(error){

        console.error(
            "EmailJS error:",
            error
        );

        return {
            success:false,
            message:
                error.text ||
                error.message ||
                "Email could not be sent."
        };

    }

}


/* =====================================================
   SEND WELCOME EMAIL
===================================================== */

async function sendWelcomeEmail(
    name,
    email,
    mobile
){

    if(!EMAILJS_CONFIG){

        const loaded =
            await loadEmailJSConfig();

        if(!loaded){

            return {
                success:false,
                message:
                    "EmailJS is not configured."
            };

        }

    }

    const templateParams = {

        // Common EmailJS variables
        name:
            name,

        user_name:
            name,

        full_name:
            name,

        email:
            email,

        to_email:
            email,

        user_email:
            email,

        mobile:
            mobile,

        company_name:
            "GlowCart",

        website:
            "https://haasini3107.github.io/GlowCart/"

    };

    return await sendEmailJS(

        EMAILJS_CONFIG.welcomeTemplateId,

        templateParams

    );

}


/* =====================================================
   SEND ORDER CONFIRMATION EMAIL
===================================================== */

async function sendOrderConfirmationEmail(
    order
){

    if(!EMAILJS_CONFIG){

        const loaded =
            await loadEmailJSConfig();

        if(!loaded){

            return {
                success:false,
                message:
                    "EmailJS is not configured."
            };

        }

    }

    let itemsText = "";

    order.items.forEach(item => {

        const qty =
            Number(
                item.qty ||
                item.quantity ||
                1
            );

        const price =
            Number(item.price || 0);

        const amount =
            price * qty;

        itemsText +=
            `${item.name} × ${qty} = ₹${amount.toFixed(2)}\n`;

    });


    const templateParams = {

        // Customer
        name:
            order.name,

        user_name:
            order.name,

        full_name:
            order.name,

        email:
            order.email,

        to_email:
            order.email,

        user_email:
            order.email,

        mobile:
            order.mobile,

        // Order
        order_id:
            order.orderId ||
            order.id,

        order_date:
            order.date,

        payment_method:
            order.paymentMethod,

        payment_details:
            order.paymentDetails || "",

        // Products
        order_items:
            itemsText,

        items:
            itemsText,

        // Amounts
        subtotal:
            Number(order.subtotal || 0)
                .toFixed(2),

        gst:
            Number(order.gst || 0)
                .toFixed(2),

        gst_rate:
            "18%",

        total:
            Number(order.total || 0)
                .toFixed(2),

        grand_total:
            Number(order.total || 0)
                .toFixed(2),

        // Address
        address:
            order.address,

        pincode:
            order.pincode,

        company_name:
            "GlowCart",

        website:
            "https://haasini3107.github.io/GlowCart/"

    };


    return await sendEmailJS(

        EMAILJS_CONFIG.orderTemplateId,

        templateParams

    );

}

document
    .getElementById("registerForm")
    .addEventListener(
        "submit",
        async function(e){

            e.preventDefault();

            const name =
                document
                    .getElementById("regName")
                    .value
                    .trim();

            const email =
                document
                    .getElementById("regEmail")
                    .value
                    .trim()
                    .toLowerCase();

            const mobile =
                document
                    .getElementById("regMobile")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("regPassword")
                    .value;

            const address =
                document
                    .getElementById("regAddress")
                    .value
                    .trim();

            const pincode =
                document
                    .getElementById("regPincode")
                    .value
                    .trim();

            const address2 =
                document
                    .getElementById("regAddress2")
                    .value
                    .trim();

            const pincode2 =
                document
                    .getElementById("regPincode2")
                    .value
                    .trim();

            const msg =
                document
                    .getElementById(
                        "registerMessage"
                    );

            const button =
                document
                    .getElementById(
                        "registerButton"
                    );


            if(!/^\d{10}$/.test(mobile)){

                msg.style.color="red";

                msg.textContent =
                    "Enter a valid 10-digit mobile number.";

                return;

            }


            if(!/^\d{6}$/.test(pincode)){

                msg.style.color="red";

                msg.textContent =
                    "Enter a valid 6-digit pincode.";

                return;

            }


            if(
                address2 &&
                !/^\d{6}$/.test(pincode2)
            ){

                msg.style.color="red";

                msg.textContent =
                    "Enter a valid second pincode.";

                return;

            }


            if(
                users.some(
                    u => u.email === email
                )
            ){

                msg.style.color="red";

                msg.textContent =
                    "This email is already registered on this browser.";

                return;

            }


            button.disabled=true;

            button.textContent =
                "Registering...";

            msg.style.color="#d41483";

            msg.textContent =
                "Creating your account...";


            try{

                const response =
                    await fetch(
                        API_BASE +
                        "/api/register",
                        {
                            method:"POST",

                            headers:{
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    name:
                                        name,

                                    email:
                                        email,

                                    mobile:
                                        mobile,

                                    password:
                                        password,

                                    address:
                                        address,

                                    pincode:
                                        pincode,

                                    address2:
                                        address2,

                                    pincode2:
                                        pincode2

                                })

                        }
                    );


                const data =
                    await response.json();


                if(
                    !response.ok ||
                    !data.success
                ){

                    msg.style.color="red";

                    msg.textContent =
                        data.message ||
                        "Registration failed.";

                    button.disabled=false;

                    button.textContent =
                        "Register Now";

                    return;

                }


                /* ----------------------------------
                   SAVE LOCAL USER
                ---------------------------------- */

                const user={

                    id:
                        data.user?.id ||
                        Date.now(),

                    name:
                        name,

                    email:
                        email,

                    mobile:
                        mobile,

                    password:
                        password,

                    addresses:[

                        {
                            id:
                                Date.now(),

                            address:
                                address,

                            pincode:
                                pincode
                        }

                    ]

                };


                if(address2){

                    user.addresses.push({

                        id:
                            Date.now()+1,

                        address:
                            address2,

                        pincode:
                            pincode2

                    });

                }


                users.push(user);


                localStorage.setItem(
                    "glowcart_users",
                    JSON.stringify(users)
                );


                /* ----------------------------------
                   SEND WELCOME EMAIL WITH EMAILJS
                ---------------------------------- */

                msg.style.color="#d41483";

                msg.textContent =
                    "Account created. Sending welcome email...";


                const emailResult =
                    await sendWelcomeEmail(
                        name,
                        email,
                        mobile
                    );


                if(emailResult.success){

                    msg.style.color="green";

                    msg.innerHTML =
                        "Registration successful! 💗<br>" +
                        "Welcome email sent to <b>" +
                        email +
                        "</b>.";

                }else{

                    msg.style.color="#d41483";

                    msg.innerHTML =
                        "Registration successful! 💗<br>" +
                        "Account created, but the welcome email could not be sent.";

                    console.error(
                        "Welcome email failed:",
                        emailResult.message
                    );

                }


                button.disabled=false;

                button.textContent =
                    "Register Now";


                setTimeout(function(){

                    document.getElementById(
                        "loginEmail"
                    ).value =
                        email;

                    openLogin();

                },2200);


            }catch(error){

                console.error(
                    "Registration error:",
                    error
                );

                msg.style.color="red";

                msg.textContent =
                    "Unable to connect to GlowCart server.";

                button.disabled=false;

                button.textContent =
                    "Register Now";

            }

        }
    );


/* =====================================================
   LOGIN
===================================================== */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async function(e){

            e.preventDefault();

            const email =
                document
                    .getElementById(
                        "loginEmail"
                    )
                    .value
                    .trim()
                    .toLowerCase();

            const password =
                document
                    .getElementById(
                        "loginPassword"
                    )
                    .value;

            const msg =
                document
                    .getElementById(
                        "loginMessage"
                    );


            const user =
                users.find(
                    u =>
                        u.email === email &&
                        u.password === password
                );


            if(!user){

                msg.style.color="red";

                msg.textContent =
                    "Invalid email or password.";

                return;

            }


            currentUser=user;


            localStorage.setItem(
                "glowcart_user",
                JSON.stringify(user)
            );


            msg.style.color="green";

            msg.textContent =
                "Login successful!";


            setTimeout(function(){

                openShop();

            },700);

        }
    );

function showProducts(){

    hidePanels();

    document.getElementById(
        "products"
    ).style.display="grid";

    renderProducts();

}


function renderProducts(){

    const search =
        document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


    let list =
        PRODUCTS.filter(
            product => {

                let categoryOK=true;


                if(
                    selectedCategory ===
                    "face"
                ){

                    categoryOK =
                        product.category ===
                        "face";

                }


                if(
                    selectedCategory ===
                    "best"
                ){

                    categoryOK =
                        product.best === true;

                }


                const searchOK =
                    product.name
                        .toLowerCase()
                        .includes(search) ||

                    product.description
                        .toLowerCase()
                        .includes(search);


                return (
                    categoryOK &&
                    searchOK
                );

            }
        );


    const box =
        document.getElementById(
            "products"
        );


    if(!list.length){

        box.innerHTML =
            '<div class="empty">No products found.</div>';

        return;

    }


    box.innerHTML =
        list.map(
            p => `

                <div class="product">

                    <img
                        src="${p.image}"
                        alt="${p.name}"
                    >

                    <div class="productInfo">

                        <h3>
                            ${p.name}
                        </h3>

                        <p>
                            ${p.description}
                        </p>

                        <div class="price">
                            ₹${p.price}
                        </div>

                        <button
                            class="addCart"
                            onclick="addCart(${p.id})"
                        >
                            Add to Cart
                        </button>

                    </div>

                </div>

            `
        ).join("");

}


function searchProducts(){

    renderProducts();

}


function category(type,button){

    selectedCategory =
        type;


    document
        .querySelectorAll(
            ".categories button"
        )
        .forEach(
            b =>
                b.classList.remove(
                    "active"
                )
        );


    button.classList.add(
        "active"
    );


    renderProducts();

}


/* =====================================================
   CART
===================================================== */

function addCart(id){

    const product =
        PRODUCTS.find(
            p => p.id === id
        );


    const existing =
        cart.find(
            p => p.id === id
        );


    if(existing){

        existing.qty++;

    }else{

        cart.push({

            ...product,

            qty:1

        });

    }


    saveCart();

    updateCount();


    alert(
        product.name +
        " added to cart 🛒"
    );

}


function saveCart(){

    localStorage.setItem(
        "glowcart_cart",
        JSON.stringify(cart)
    );

}


function updateCount(){

    document.getElementById(
        "cartCount"
    ).textContent =
        cart.reduce(
            (sum,item) =>
                sum + item.qty,
            0
        );

}


function getSubtotal(){

    return cart.reduce(
        (sum,item) =>
            sum +
            (
                item.price *
                item.qty
            ),
        0
    );

}


function getGST(){

    return getSubtotal() *
        GST_RATE;

}


function getGrandTotal(){

    return (
        getSubtotal() +
        getGST()
    );

}


/* =====================================================
   CART DISPLAY
===================================================== */

function showCart(){

    hidePanels();

    document.getElementById(
        "cartPanel"
    ).style.display="block";

    document.getElementById(
        "products"
    ).style.display="none";

    renderCart();

}


function renderCart(){

    const box =
        document.getElementById(
            "cartItems"
        );


    if(!cart.length){

        box.innerHTML = `

            <div class="empty">

                <div style="font-size:50px">
                    🛒
                </div>

                <h3>
                    Your cart is empty
                </h3>

                <button
                    class="mainBtn"
                    style="margin-top:20px"
                    onclick="showProducts()"
                >
                    Continue Shopping
                </button>

            </div>

        `;


        document.getElementById(
            "total"
        ).textContent =
            "0.00";

        return;

    }


    box.innerHTML =
        cart.map(
            (item,index) => `

                <div class="cartItem">

                    <img
                        src="${item.image}"
                    >

                    <div class="cartInfo">

                        <strong>
                            ${item.name}
                        </strong>

                        <div
                            style="
                            color:#d41483;
                            margin-top:6px
                            "
                        >
                            ₹${item.price}
                        </div>

                    </div>

                    <div class="quantity">

                        <button
                            onclick="quantity(${index},-1)"
                        >
                            −
                        </button>

                        <strong>
                            ${item.qty}
                        </strong>

                        <button
                            onclick="quantity(${index},1)"
                        >
                            +
                        </button>

                    </div>

                    <strong>
                        ₹${(
                            item.price *
                            item.qty
                        ).toFixed(2)}
                    </strong>

                    <button
                        onclick="removeItem(${index})"
                        style="
                        border:0;
                        background:none;
                        color:red;
                        font-size:18px
                        "
                    >
                        ✕
                    </button>

                </div>

            `
        ).join("");


    document.getElementById(
        "total"
    ).textContent =
        getSubtotal().toFixed(2);

}


function quantity(index,value){

    cart[index].qty += value;


    if(cart[index].qty <= 0){

        cart.splice(
            index,
            1
        );

    }


    saveCart();

    updateCount();

    renderCart();

}


function removeItem(index){

    cart.splice(
        index,
        1
    );

    saveCart();

    updateCount();

    renderCart();

}

   BILL
===================================================== */

function updateCheckoutBill(){

    const subtotal =
        getSubtotal();

    const gst =
        getGST();

    const grandTotal =
        getGrandTotal();


    document.getElementById(
        "checkoutSubtotal"
    ).textContent =
        subtotal.toFixed(2);


    document.getElementById(
        "checkoutGST"
    ).textContent =
        gst.toFixed(2);


    document.getElementById(
        "checkoutGrandTotal"
    ).textContent =
        grandTotal.toFixed(2);

}


/* =====================================================
   PAYMENT
===================================================== */

function selectPayment(method){

    document
        .querySelectorAll(
            ".paymentOption"
        )
        .forEach(
            option =>
                option.classList.remove(
                    "selected"
                )
        );


    document.getElementById(
        "upiDetails"
    ).style.display="none";


    document.getElementById(
        "netBankingDetails"
    ).style.display="none";


    document.getElementById(
        "codDetails"
    ).style.display="none";


    if(method === "UPI"){

        document.getElementById(
            "upiOption"
        ).classList.add(
            "selected"
        );

        document.getElementById(
            "upiDetails"
        ).style.display="block";

    }


    if(
        method ===
        "Net Banking"
    ){

        document.getElementById(
            "netBankingOption"
        ).classList.add(
            "selected"
        );

        document.getElementById(
            "netBankingDetails"
        ).style.display="block";

    }


    if(
        method ===
        "Cash on Delivery"
    ){

        document.getElementById(
            "codOption"
        ).classList.add(
            "selected"
        );

        document.getElementById(
            "codDetails"
        ).style.display="block";

    }

}

                                Address ${i+1}
                            </strong>

                            <br>

                            <span
                                style="color:#666"
                            >
                                ${a.address}
                                <br>
                                Pincode:
                                ${a.pincode}
                            </span>

                        </div>

                    </label>

                </div>

            `
        )
        .join("");


    selectAddress(0);

}


function selectAddress(index){

    const address =
        currentUser
            .addresses[index];


    if(!address)return;


    document.getElementById(
        "orderAddress"
    ).value =
        address.address;


    document.getElementById(
        "orderPincode"
    ).value =
        address.pincode;


    document
        .querySelectorAll(
            ".addressCard"
        )
        .forEach(
            (x,i) =>
                x.classList.toggle(
                    "selected",
                    i === index
                )
        );

}


function newAddress(){

    document.getElementById(
        "newAddressBox"
    ).style.display =
        "block";

}


function saveNewAddress(){

    const address =
        document.getElementById(
            "newAddress"
        ).value.trim();


    const pincode =
        document.getElementById(
            "newPincode"
        ).value.trim();


    if(!address){

        alert(
            "Enter address."
        );

        return;

    }


    if(
        !/^\d{6}$/.test(
            pincode
        )
    ){

        alert(
            "Enter a valid 6-digit pincode."
        );

        return;

    }


    currentUser.addresses.push({

        id:
            Date.now(),

        address:
            address,

        pincode:
            pincode

    });


    users =
        users.map(
            u =>
                u.email ===
                currentUser.email
                    ? currentUser
                    : u
        );


    localStorage.setItem(
        "glowcart_users",
        JSON.stringify(users)
    );


    localStorage.setItem(
        "glowcart_user",
        JSON.stringify(currentUser)
    );


    document.getElementById(
        "newAddress"
    ).value="";


    document.getElementById(
        "newPincode"
    ).value="";


    document.getElementById(
        "newAddressBox"
    ).style.display =
        "none";


    showAddresses();

}


/* =====================================================
   PLACE ORDER
===================================================== */

async function placeOrder(){

    if(!cart.length){

        alert(
            "Your cart is empty."
        );

        return;

    }


    const name =
        document.getElementById(
            "orderName"
        ).value.trim();


    const email =
        document.getElementById(
            "orderEmail"
        ).value.trim();


    const mobile =
        document.getElementById(
            "orderMobile"
        ).value.trim();


    const address =
        document.getElementById(
            "orderAddress"
        ).value.trim();


    const pincode =
        document.getElementById(
            "orderPincode"
        ).value.trim();


    if(
        !name ||
        !email ||
        !mobile ||
        !address
    ){

        alert(
            "Please complete all details."
        );

        return;

    }


    if(
        !/^\d{6}$/.test(
            pincode
        )
    ){

        alert(
            "Enter a valid pincode."
        );

        return;

    }


    /* -----------------------------------------------
       PAYMENT
    ----------------------------------------------- */

    const paymentRadio =
        document.querySelector(
            'input[name="paymentMethod"]:checked'
        );


    if(!paymentRadio){

        alert(
            "Please select a payment method."
        );

        return;

    }


    const paymentMethod =
        paymentRadio.value;


    let paymentDetails="";


    if(
        paymentMethod ===
        "UPI"
    ){

        const upiId =
            document.getElementById(
                "upiId"
            ).value.trim();


        if(!upiId){

            alert(
                "Please enter your UPI ID."
            );

            return;

        }


        if(!upiId.includes("@")){

            alert(
                "Please enter a valid UPI ID."
            );

            return;

        }


        paymentDetails =
            upiId;

    }


    if(
        paymentMethod ===
        "Net Banking"
    ){

        const bankName =
            document.getElementById(
                "bankName"
            ).value;


        if(!bankName){

            alert(
                "Please select your bank."
            );

            return;

        }


        paymentDetails =
            bankName;

    }


    if(
        paymentMethod ===
        "Cash on Delivery"
    ){

        paymentDetails =
            "Pay cash on delivery";

    }


    /* -----------------------------------------------
       BILL
    ----------------------------------------------- */

    const subtotal =
        getSubtotal();


    const gst =
        getGST();


    const grandTotal =
        getGrandTotal();


    /* -----------------------------------------------
       ORDER
    ----------------------------------------------- */

    const orderId =
        "GC" + Date.now();


    const order = {

        id:
            orderId,

        orderId:
            orderId,

        date:
            new Date().toLocaleString(),

        name:
            name,

        email:
            email,

        mobile:
            mobile,

        address:
            address,

        pincode:
            pincode,

        items:
            [...cart],

        subtotal:
            Number(
                subtotal.toFixed(2)
            ),

        gst:
            Number(
                gst.toFixed(2)
            ),

        gstRate:
            18,

        total:
            Number(
                grandTotal.toFixed(2)
            ),

        paymentMethod:
            paymentMethod,

        paymentDetails:
            paymentDetails,

        status:
            "Order Placed"

    };


    const orderMessage =
        document.getElementById(
            "orderMessage"
        );


    const placeButton =
        document.getElementById(
            "placeOrderButton"
        );


    placeButton.disabled=true;

    placeButton.textContent =
        "Placing Order...";


    orderMessage.style.color =
        "#d41483";


    orderMessage.textContent =
        "Processing your order...";


    try{

        /* -------------------------------------------
           SAVE ORDER TO RENDER
        ------------------------------------------- */

        const response =
            await fetch(
                API_BASE +
                "/api/orders",
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify(order)

                }
            );


        const data =
            await response.json();


        console.log(
            "GlowCart order response:",
            data
        );


        if(
            !response.ok ||
            !data.success
        ){

            orderMessage.style.color =
                "red";

            orderMessage.textContent =
                data.message ||
                "Unable to place order.";

            placeButton.disabled=false;

            placeButton.textContent =
                "Place Order";

            return;

        }


        /* -------------------------------------------
           SAVE ORDER LOCALLY
        ------------------------------------------- */

        orders.unshift(order);


        localStorage.setItem(
            "glowcart_orders",
            JSON.stringify(orders)
        );


        /* -------------------------------------------
           SEND ORDER EMAIL USING EMAILJS
        ------------------------------------------- */

        orderMessage.style.color =
            "#d41483";


        orderMessage.textContent =
            "Order saved. Sending confirmation email...";


        const emailResult =
            await sendOrderConfirmationEmail(
                order
            );


        /* -------------------------------------------
           CLEAR CART
        ------------------------------------------- */

        cart=[];

        saveCart();

        updateCount();


        /* -------------------------------------------
           RESULT
        ------------------------------------------- */

        if(
            emailResult.success
        ){

            orderMessage.style.color =
                "green";


            orderMessage.innerHTML =
                "🎉 Order placed successfully!<br>" +
                "Confirmation email sent to <b>" +
                email +
                "</b><br><br>" +
                "📦 Order ID: <b>" +
                order.id +
                "</b><br>" +
                "💳 Payment: <b>" +
                paymentMethod +
                "</b><br>" +
                "💰 Total: <b>₹" +
                grandTotal.toFixed(2) +
                "</b>";

        }else{

            console.error(
                "Order email failed:",
                emailResult.message
            );


            orderMessage.style.color =
                "#d41483";


            orderMessage.innerHTML =
                "🎉 Order placed successfully!<br>" +
                "Order saved, but confirmation email could not be sent.<br><br>" +
                "📦 Order ID: <b>" +
                order.id +
                "</b><br>" +
                "💳 Payment: <b>" +
                paymentMethod +
                "</b><br>" +
                "💰 Total: <b>₹" +
                grandTotal.toFixed(2) +
                "</b>";

        }


        placeButton.disabled=false;

        placeButton.textContent =
            "Place Order";


        setTimeout(function(){

            showOrders();

        },3000);


    }catch(error){

        console.error(
            "Order connection error:",
            error
        );


        orderMessage.style.color =
            "red";


        orderMessage.textContent =
            "Unable to connect to GlowCart server.";


        placeButton.disabled=false;

        placeButton.textContent =
            "Place Order";

    }

}

function showOrders(){

    hidePanels();


    document.getElementById(
        "ordersPanel"
    ).style.display =
        "block";


    document.getElementById(
        "products"
    ).style.display =
        "none";


    renderOrders();

}


function renderOrders(){

    const box =
        document.getElementById(
            "orders"
        );


    if(!orders.length){

        box.innerHTML = `

            <div class="empty">

                <div style="font-size:50px">
                    📦
                </div>

                <h3>
                    No orders yet
                </h3>

            </div>

        `;

        return;

    }


    const myOrders =
        currentUser
            ? orders.filter(
                o =>
                    o.email ===
                    currentUser.email
            )
            : [];


    if(!myOrders.length){

        box.innerHTML =
            '<div class="empty">No orders yet.</div>';

        return;

    }


    box.innerHTML =
        myOrders.map(
            o => `

                <div class="order">

                    <div
                        style="
                        display:flex;
                        justify-content:space-between;
                        gap:15px;
                        flex-wrap:wrap
                        "
                    >

                        <div>

                            <strong>
                                Order #${o.id}
                            </strong>

                            <p
                                style="
                                color:#777;
                                margin-top:6px
                                "
                            >
                                ${o.date}
                            </p>

                        </div>

                        <strong
                            style="
                            color:#d41483;
                            font-size:20px
                            "
                        >
                            ₹${Number(
                                o.total || 0
                            ).toFixed(2)}
                        </strong>

                    </div>


                    <div
                        style="margin-top:15px"
                    >

                        ${o.items.map(
                            item => `

                                <div
                                    style="
                                    padding:5px 0;
                                    color:#555
                                    "
                                >
                                    ${item.name}
                                    ×
                                    ${item.qty}
                                </div>

                            `
                        ).join("")}

                    </div>


                    <div
                        style="
                        margin-top:15px;
                        padding:15px;
                        background:#fff7fc;
                        border-radius:10px;
                        "
                    >

                        <div class="billRow">

                            <span>
                                Subtotal
                            </span>

                            <strong>
                                ₹${Number(
                                    o.subtotal || 0
                                ).toFixed(2)}
                            </strong>

                        </div>


                        <div class="billRow">

                            <span>
                                GST (${o.gstRate || 18}%)
                            </span>

                            <strong>
                                ₹${Number(
                                    o.gst || 0
                                ).toFixed(2)}
                            </strong>

                        </div>


                        <div class="billRow">

                            <span>
                                Payment
                            </span>

                            <strong>
                                ${
                                    o.paymentMethod ||
                                    "Not specified"
                                }
                            </strong>

                        </div>


                        <div
                            class="billRow totalRow"
                        >

                            <span>
                                Total
                            </span>

                            <strong>
                                ₹${Number(
                                    o.total || 0
                                ).toFixed(2)}
                            </strong>

                        </div>

                    </div>


                    <div class="status">
                        ✓ ${o.status}
                    </div>


                    <p
                        style="
                        margin-top:12px;
                        color:#666
                        "
                    >
                        📍 ${o.address}
                        <br>
                        Pincode:
                        ${o.pincode}
                    </p>


                </div>

            `
        ).join("");

}
