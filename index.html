<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlowCart - Premium Face Creams</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f6f8;
    color:#222;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* ================= LOGIN / REGISTER ================= */

.auth-screen{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e2,#f4d9ff,#e7d8ff);
    padding:20px;
}

.auth-box{
    width:420px;
    max-width:100%;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 15px 50px #0002;
}

.auth-logo{
    text-align:center;
    margin-bottom:25px;
}

.auth-logo h1{
    font-family:Georgia;
    color:#d65a7a;
    font-size:42px;
}

.auth-logo span{
    color:#333;
}

.auth-logo p{
    color:#777;
    margin-top:5px;
}

.auth-box h2{
    text-align:center;
    margin-bottom:20px;
}

.auth-box input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

.auth-btn{
    width:100%;
    padding:14px;
    border:0;
    background:#131921;
    color:white;
    border-radius:7px;
    margin-top:12px;
    font-weight:bold;
}

.auth-switch{
    text-align:center;
    margin-top:18px;
    color:#666;
}

.auth-switch span{
    color:#d65a7a;
    font-weight:bold;
    cursor:pointer;
}

.auth-message{
    padding:10px;
    border-radius:6px;
    margin-bottom:10px;
    text-align:center;
}

/* ================= HEADER ================= */

.header{
    background:#131921;
    color:white;
    display:flex;
    align-items:center;
    gap:25px;
    padding:12px 30px;
    position:sticky;
    top:0;
    z-index:50;
}

.logo{
    min-width:180px;
}

.logo h1{
    font-family:Georgia;
    color:#ffb6c9;
}

.logo h1 span{
    color:white;
}

.logo small{
    color:#ddd;
}

.search{
    display:flex;
    flex:1;
    max-width:700px;
}

.search input{
    width:100%;
    padding:13px;
    border:0;
    outline:0;
    font-size:15px;
}

.search button{
    width:55px;
    border:0;
    background:#ffb6c9;
    font-size:20px;
}

.headlink{
    color:white;
    text-align:center;
    cursor:pointer;
}

.headlink small{
    display:block;
    color:#ccc;
    font-size:11px;
}

.nav{
    background:#232f3e;
    color:white;
    padding:13px 30px;
    display:flex;
    gap:30px;
}

.nav span{
    cursor:pointer;
}

.nav span:hover{
    color:#ffb6c9;
}

/* ================= HOME ================= */

.hero{
    margin:20px 30px;
    padding:55px 70px;
    border-radius:15px;
    background:linear-gradient(90deg,#ffe3eb,#fff5f7);
    display:flex;
    align-items:center;
    justify-content:space-between;
    min-height:330px;
}

.hero h2{
    font:45px Georgia;
    margin:12px 0;
}

.hero p{
    color:#555;
    max-width:550px;
    line-height:1.6;
}

.hero button{
    margin-top:20px;
    background:#131921;
    color:white;
    border:0;
    padding:14px 25px;
    border-radius:6px;
    font-weight:bold;
}

.hero-icon{
    font-size:130px;
}

.section{
    background:white;
    margin:20px 30px;
    padding:25px;
    border-radius:12px;
}

.heading{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
}

.products{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:18px;
}

.card{
    border:1px solid #ddd;
    border-radius:10px;
    overflow:hidden;
    background:white;
    transition:.2s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 7px 20px #0002;
}

.card img{
    width:100%;
    height:220px;
    object-fit:contain;
    background:#fafafa;
    padding:15px;
}

.info{
    padding:14px;
